<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Family Calendar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      padding: 50px 40px;
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2em;
    }

    .subtitle {
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: left;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #764ba2;
    }

    button:active {
      transform: scale(0.98);
    }

    .error {
      color: #ff6b6b;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }

    .error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>🔐 Login</h1>
    <p class="subtitle">Enter password to access</p>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Enter password"
          autocomplete="off"
          autofocus
        >
      </div>
      <button type="submit">Access</button>
      <div class="error" id="errorMsg">Invalid password. Try again.</div>
    </form>
  </div>

  <script>
    const CORRECT_PASSWORD = 'Prigat';
    const SESSION_KEY = 'familyCalendarAuth';

    function handleLogin(event) {
      event.preventDefault();
      const passwordInput = document.getElementById('password');
      const errorMsg = document.getElementById('errorMsg');
      const password = passwordInput.value;

      if (password === CORRECT_PASSWORD) {
        // Store authentication in session storage (cleared when browser closes)
        sessionStorage.setItem(SESSION_KEY, 'true');
        // Redirect to index.html
        window.location.href = 'index.html';
      } else {
        passwordInput.value = '';
        errorMsg.classList.add('show');
        passwordInput.focus();
      }
    }

    // Check if already authenticated
    window.addEventListener('load', function() {
      if (sessionStorage.getItem(SESSION_KEY) === 'true') {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
